name: Disc menu native artifacts
on:
  push:
    branches: [codex/bluray-disc-menu]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: disc-menu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, abi: arm64-v8a}
          - {arch: armv7l, abi: armeabi-v7a}
          - {arch: x86_64, abi: x86_64}
          - {arch: x86, abi: x86}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config ninja-build nasm unzip zip cmake
          python -m pip install meson==1.9.1
          sdkmanager 'ndk;25.2.9519653'
      - name: Build and verify ${{ matrix.abi }}
        env:
          cores: '4'
        run: |
          set -o pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/25.2.9519653"
          bash buildscripts/bundle_disc_menu.sh '${{ matrix.arch }}' '${{ matrix.abi }}' 2>&1 | tee build-${{ matrix.abi }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disc-menu-${{ matrix.abi }}
          path: |
            buildscripts/artifacts/disc-menu/**
            build-${{ matrix.abi }}.log
            buildscripts/deps/**/meson-logs/meson-log.txt
            buildscripts/deps/**/ffbuild/config.log
          if-no-files-found: error
