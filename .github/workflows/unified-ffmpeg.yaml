name: Unified FFmpeg libmpv
# libmpv linked against Fushi's unified (shared) FFmpeg; see buildscripts/bundle_unified.sh.
on:
  push:
    branches: [fushi/unified-ffmpeg]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unified-ffmpeg-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, abi: arm64-v8a}
          - {arch: armv7l, abi: armeabi-v7a}
          - {arch: x86_64, abi: x86_64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config ninja-build nasm unzip zip cmake
          python -m pip install meson==1.9.1 jsonschema==4.23.0 jinja2==3.1.6
          sdkmanager 'ndk;27.3.13750724'
      - name: Build and verify ${{ matrix.abi }}
        env:
          cores: '4'
        run: |
          set -o pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          bash buildscripts/bundle_unified.sh '${{ matrix.arch }}' '${{ matrix.abi }}' 2>&1 | tee build-${{ matrix.abi }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-${{ matrix.abi }}
          path: |
            buildscripts/artifacts/unified/**
            build-${{ matrix.abi }}.log
            buildscripts/deps/**/meson-logs/meson-log.txt
          if-no-files-found: error
